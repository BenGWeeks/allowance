name: gitleaks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and run gitleaks
        run: |
          # Pinned to match black-panther; bump deliberately.
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gl.tar.gz
          tar -xzf gl.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1
