name: Prepare release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: allowance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/api-unit-tests.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/build_release.py --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" --output /tmp/allowance-release
      - name: Create draft release for maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            /tmp/allowance-release/*.zip \
            /tmp/allowance-release/SHA256SUMS \
            /tmp/allowance-release/release-manifest.json
