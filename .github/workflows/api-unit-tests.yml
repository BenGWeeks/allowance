name: API Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests fastapi
        
    - name: Run Python API tests
      run: |
        cd tests
        # Check if API test files exist
        if ls test_api_*.py 1> /dev/null 2>&1; then
          echo "Running API tests..."
          python -m pytest test_api_*.py -v
        else
          echo "✅ No API test files found - skipping pytest (this is expected for now)"
          echo "   API tests can be added later as test_api_*.py files"
        fi

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy
        
    - name: Run Black formatter check
      run: black --check .
      
    - name: Run Flake8 linter
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Run MyPy type checker
      run: mypy . --ignore-missing-imports