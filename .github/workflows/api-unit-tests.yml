name: Allowance checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: allowance-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
    steps:
      - name: Resolve supported and latest stable releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/lnbits/lnbits/releases/latest --jq .tag_name)
          [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          matrix=$(jq -cn --arg latest "$latest" '["v1.6.0", "v1.6.1", $latest] | unique')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  regression:
    name: Regression (${{ matrix.version }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull official LNbits runtime
        env:
          LNBITS_VERSION: ${{ matrix.version }}
        run: docker pull "lnbits/lnbits:$LNBITS_VERSION"
      - name: Run offline regression and database tests
        env:
          LNBITS_VERSION: ${{ matrix.version }}
        run: |
          docker run --rm --network none \
            -e LNBITS_DATA_FOLDER=/tmp/allowance-tests \
            -e LNBITS_BACKEND_WALLET_CLASS=FakeWallet \
            -e LOGURU_LEVEL=ERROR \
            -v "$GITHUB_WORKSPACE:/app/lnbits/extensions/allowance:ro" \
            "lnbits/lnbits:$LNBITS_VERSION" \
            /app/.venv/bin/python /app/lnbits/extensions/allowance/tests/run_unit_tests.py

  postgres:
    name: PostgreSQL (LNbits v1.6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull test runtimes
        run: |
          docker pull postgres:15
          docker pull lnbits/lnbits:v1.6.1
      - name: Run isolated PostgreSQL regressions
        run: bash tests/run_postgres_tests.sh

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned quality tools
        run: python -m pip install black==24.10.0 ruff==0.11.13
      - name: Check formatting and lint
        run: |
          black --check ./*.py tests/unit tests/run_unit_tests.py
          ruff check ./*.py tests/unit tests/run_unit_tests.py
      - name: Check extension metadata
        run: |
          python -m json.tool config.json > /dev/null
          python -m json.tool manifest.json > /dev/null
          python -m json.tool extensions.json > /dev/null

  required:
    name: Allowance checks passed
    if: always()
    needs: [versions, regression, postgres, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = "success,success,success,success"
