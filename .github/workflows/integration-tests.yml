      with:
        node-version: '18'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry requests pytest
        git clone https://github.com/lnbits/lnbits.git
        cd lnbits
        poetry install
        cd ..
        
    - name: Install Playwright for API testing
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium
        
    - name: Setup LNBits environment
      run: |
        cd lnbits
        cp .env.example .env
        echo "LNBITS_BACKEND_WALLET_CLASS=VoidWallet" >> .env
        # Create database using psql
        PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE lnbits;" || echo "Database might already exist"
        echo "LNBITS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lnbits" >> .env
