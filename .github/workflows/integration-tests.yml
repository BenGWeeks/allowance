name: LNBits Extension Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  extension-setup:
    name: Setup Extension Environment  
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lnbits
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        git clone https://github.com/lnbits/lnbits.git
        cd lnbits
        poetry install
        cd ..
        
    - name: Install Playwright
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium
        
    - name: Setup LNBits environment
      run: |
        cd lnbits
        cp .env.example .env
        echo "LNBITS_BACKEND_WALLET_CLASS=VoidWallet" >> .env
        echo "LNBITS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lnbits" >> .env
        echo "LNBITS_EXTENSIONS_DEFAULT_INSTALL=allowance" >> .env
        
    - name: Copy allowance extension
      run: |
        cp -r . lnbits/lnbits/extensions/allowance/
        
    - name: Start LNBits
      run: |
        cd lnbits
        poetry run python -m lnbits &
        echo $! > lnbits.pid
        sleep 30
        curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:5000/
        
    - name: Create admin account
      run: |
        cd tests
        node create-admin-account.js
        
    - name: Enable allowance extension
      run: |
        cd tests
        node enable-allowance.js
        
    - name: Stop LNBits
      if: always()
      run: |
        cd lnbits
        if [ -f lnbits.pid ]; then
          kill $(cat lnbits.pid) || true
        fi

  crud-operations:
    name: Test CRUD Operations
    needs: extension-setup
