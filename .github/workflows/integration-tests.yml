name: LNBits Extension Integration Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  extension-validation:
    name: Validate Extension Files
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Validate extension structure
      run: |
        echo "🔍 Checking required extension files..."
        
        # Check required files exist
        required_files=("manifest.json" "views.py" "models.py" "crud.py" "__init__.py")
        for file in "${required_files[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        # Check Python syntax
        echo "🐍 Checking Python syntax..."
        python -m py_compile *.py
        echo "✅ All Python files have valid syntax"
        
        # Check manifest.json is valid JSON
        echo "📋 Validating manifest.json..."
        python -c "import json; json.load(open('manifest.json'))"
        echo "✅ manifest.json is valid JSON"
        
        echo "🎉 Extension validation passed!"

  python-tests:
    name: Python Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy pydantic fastapi
        
    - name: Run code quality checks
      run: |
        echo "🎨 Running Black formatter check..."
        black --check --diff *.py || echo "Black formatting issues found"
        
        echo "🔍 Running Flake8 linter..."
        flake8 *.py --max-line-length=100 --ignore=E203,W503 || echo "Flake8 issues found"
        
        echo "🔬 Running basic import checks..."
        python -c "
        try:
            import crud, models, views
            print('✅ All modules import successfully')
        except Exception as e:
            print(f'⚠️ Import check skipped: {e}')
        "

  integration-tests:
    name: LNBits Integration Tests
    runs-on: ubuntu-latest
    needs: [extension-validation, python-tests]
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lnbits
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        # Clone latest main branch and use minimal setup
        git clone https://github.com/lnbits/lnbits.git
        cd lnbits
        # Install dependencies with minimal extras
        poetry install --without dev
        cd ..
        
    - name: Install Playwright
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium
        
    - name: Install PostgreSQL client
      run: |
        sudo apt-get update -y
        sudo apt-get install -y postgresql-client
        
    - name: Setup LNBits environment
      run: |
        cd lnbits
        cp .env.example .env
        
        # Configure database and environment
        echo "LNBITS_BACKEND_WALLET_CLASS=VoidWallet" >> .env
        echo "LNBITS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lnbits" >> .env
        echo "HOST=0.0.0.0" >> .env
        echo "PORT=5001" >> .env
        echo "DEBUG=true" >> .env
        echo "LNBITS_FORCE_HTTPS=false" >> .env
        
        # Export environment variables to shell
        export LNBITS_BACKEND_WALLET_CLASS=VoidWallet
        export LNBITS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lnbits
        export HOST=0.0.0.0
        export PORT=5001
        export DEBUG=true
        export LNBITS_FORCE_HTTPS=false
        
        # Create database and ensure permissions
        PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -c "DROP DATABASE IF EXISTS lnbits;"
        PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE lnbits;"
        
    - name: Start LNBits
      run: |
        cd lnbits
        echo "🚀 Starting LNBits without extensions first..."
        
        # Set explicit environment variables for this step
        export LNBITS_BACKEND_WALLET_CLASS=VoidWallet
        export LNBITS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lnbits
        export HOST=0.0.0.0
        export PORT=5001
        export DEBUG=true
        export LNBITS_FORCE_HTTPS=false
        
        # Verify environment variables
        echo "🔍 Environment verification:"
        echo "LNBITS_DATABASE_URL=$LNBITS_DATABASE_URL"
        echo "LNBITS_BACKEND_WALLET_CLASS=$LNBITS_BACKEND_WALLET_CLASS"
        echo "PORT=$PORT"
        echo "HOST=$HOST"
        
        # Test database connection
        echo "🗄️ Testing database connection..."
        PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d lnbits -c "SELECT 1;" || {
          echo "❌ Database connection failed"
          exit 1
        }
        echo "✅ Database connection successful"
        
        # Show LNBits version and available commands
        echo "📋 LNBits version info:"
        poetry run python -m lnbits --version 2>&1 || echo "No version command available"
        
        echo "📋 Available LNBits commands:"
        poetry run python -m lnbits --help 2>&1 | head -10 || echo "Help command failed"
        
        # Run migration with full error capture
        echo "🔄 Running database migrations..."
        if ! poetry run python -m lnbits --migrate 2>&1 | tee migration.log; then
          echo "❌ Migration failed with output:"
          cat migration.log
          exit 1
        fi
        echo "✅ Database migration completed"
        
        # Check Python can import lnbits
        echo "🐍 Testing Python imports..."
        if ! poetry run python -c "import lnbits; print('✅ LNBits module imported successfully')"; then
          echo "❌ Failed to import LNBits module"
          exit 1
        fi
        
        # Start LNBits server
        echo "🚀 Starting LNBits server..."
        echo "Working directory: $(pwd)"
        echo "Python path: $(which python)"
        echo "Poetry path: $(which poetry)"
        
        # Start LNBits and capture both stdout and stderr
        poetry run python -m lnbits 2>&1 | tee lnbits.log &
        LNBITS_PID=$!
        echo "LNBits started with PID: $LNBITS_PID"
        
        # Give it a moment to start
        sleep 2
        echo "📋 Initial log check:"
        head -10 lnbits.log 2>/dev/null || echo "No log output yet"
        
        # Monitor startup with detailed logging
        echo "⏳ Monitoring LNBits startup..."
        for i in {1..40}; do
          # Check if process is still running
          if ! ps -p $LNBITS_PID > /dev/null; then
            echo "❌ LNBits process died after $i seconds"
            echo "📋 Process exit status:"
            wait $LNBITS_PID
            echo "Exit code: $?"
            echo "📋 Full error log:"
            cat lnbits.log
            exit 1
          fi
          
          # Check if HTTP server is responding
          if curl -f http://localhost:5001/ --max-time 3 2>/dev/null; then
            echo "✅ LNBits HTTP server is responding!"
            break
          fi
          
          # Show progress and recent log entries
          if [ $((i % 5)) -eq 0 ]; then
            echo "⏳ Still waiting for LNBits... ($i/40 seconds)"
            echo "📋 Recent log entries:"
            tail -5 lnbits.log 2>/dev/null || echo "No log entries yet"
          fi
          
          sleep 1
        done
        
        # Final verification
        if ! curl -f http://localhost:5001/ --max-time 5; then
          echo "❌ LNBits failed to respond after 40 seconds"
          echo "📋 Process status:"
          ps -p $LNBITS_PID || echo "Process died"
          echo "📋 Full startup log:"
          cat lnbits.log
          echo "📋 Migration log:"
          cat migration.log 2>/dev/null || echo "No migration log"
          exit 1
        fi
        
        echo "🎉 LNBits is ready and responding!"
        
    - name: Install allowance extension
      run: |
        echo "📦 Installing allowance extension to running LNBits..."
        
        # Copy the entire extension directory
        cp -r . lnbits/lnbits/extensions/allowance/
        
        echo "✅ Extension copied successfully"
        echo "📋 Checking copied files:"
        ls -la lnbits/lnbits/extensions/allowance/
        
    - name: Create admin account
      run: |
        cd tests
        node create-admin-account.js
        
    - name: Enable allowance extension
      run: |
        cd tests
        node enable-allowance.js
        
    - name: Test allowance creation (CRUD)
      run: |
        cd tests
        node create-allowance.js "Test Daily" 50 daily
        node create-allowance.js "Test Weekly" 100 weekly
        node create-allowance.js "Test Monthly" 200 monthly
        
    - name: Test allowance editing
      run: |
        cd tests
        node edit-allowance.js "Test Daily" "Updated Daily" 75 weekly
        
    - name: Test allowance deletion
      run: |
        cd tests
        node delete-allowance.js "Updated Daily"
        
    - name: Test API endpoints
      run: |
        cd tests
        echo "Testing API endpoints with curl..."
        
        # Test health check
        curl -f http://localhost:5001/api/v1/allowance || echo "Health check failed (expected - needs auth)"
        
        # Test API documentation endpoint
        curl -f http://localhost:5001/docs || echo "API docs endpoint check"
        
    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-screenshots
        path: tests/test-results/
        
    - name: Stop LNBits
      if: always()
      run: |
        cd lnbits
        if [ -f lnbits.pid ]; then
          kill $(cat lnbits.pid) || true
        fi