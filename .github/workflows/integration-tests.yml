name: LNBits Extension Integration Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  extension-validation:
    name: Validate Extension Files
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Validate extension structure
      run: |
        echo "🔍 Checking required extension files..."
        
        # Check required files exist
        required_files=("manifest.json" "views.py" "models.py" "crud.py" "__init__.py")
        for file in "${required_files[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        # Check Python syntax
        echo "🐍 Checking Python syntax..."
        python -m py_compile *.py
        echo "✅ All Python files have valid syntax"
        
        # Check manifest.json is valid JSON
        echo "📋 Validating manifest.json..."
        python -c "import json; json.load(open('manifest.json'))"
        echo "✅ manifest.json is valid JSON"
        
        echo "🎉 Extension validation passed!"

  python-tests:
    name: Python Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy pydantic fastapi
        
    - name: Run code quality checks
      run: |
        echo "🎨 Running Black formatter check..."
        black --check --diff *.py || echo "Black formatting issues found"
        
        echo "🔍 Running Flake8 linter..."
        flake8 *.py --max-line-length=100 --ignore=E203,W503 || echo "Flake8 issues found"
        
        echo "🔬 Running basic import checks..."
        python -c "
        try:
            import crud, models, views
            print('✅ All modules import successfully')
        except Exception as e:
            print(f'⚠️ Import check skipped: {e}')
        "

  integration-tests:
    name: LNBits Integration Tests
    runs-on: ubuntu-latest
    needs: [extension-validation, python-tests]
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lnbits
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install PostgreSQL client
      run: |
        sudo apt-get update -y
        sudo apt-get install -y postgresql-client
        
    - name: Install LNBits
      run: |
        echo "📦 Installing LNBits directly..."
        
        # Install Poetry
        pip install poetry
        
        # Clone LNBits
        git clone https://github.com/lnbits/lnbits.git lnbits-app
        cd lnbits-app
        
        # Install dependencies
        poetry install --without dev
        
        # Setup environment
        cp .env.example .env
        echo "LNBITS_BACKEND_WALLET_CLASS=FakeWallet" >> .env
        echo "LNBITS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lnbits" >> .env
        echo "HOST=0.0.0.0" >> .env
        echo "PORT=5001" >> .env
        echo "DEBUG=true" >> .env
        echo "LNBITS_FORCE_HTTPS=false" >> .env
        
        cd ..
        
    - name: Install allowance extension
      run: |
        echo "📦 Installing allowance extension..."
        
        # Copy extension to LNBits extensions directory
        mkdir -p lnbits-app/lnbits/extensions/allowance
        cp *.py *.json lnbits-app/lnbits/extensions/allowance/ 2>/dev/null || true
        cp -r static lnbits-app/lnbits/extensions/allowance/ 2>/dev/null || true
        cp -r templates lnbits-app/lnbits/extensions/allowance/ 2>/dev/null || true
        
        echo "📋 Extension files installed:"
        ls -la lnbits-app/lnbits/extensions/allowance/
        
    - name: Start LNBits
      run: |
        cd lnbits-app
        
        # Export environment variables  
        export LNBITS_BACKEND_WALLET_CLASS=FakeWallet
        export LNBITS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/lnbits
        export HOST=0.0.0.0
        export PORT=5001
        export DEBUG=true
        export LNBITS_FORCE_HTTPS=false
        
        # Test database connection
        echo "🗄️ Testing PostgreSQL connection..."
        PGPASSWORD=postgres psql -h localhost -U postgres -d lnbits -c "SELECT version();" || {
          echo "❌ Database connection failed"
          echo "🔍 Checking PostgreSQL service status..."
          pg_isready -h localhost -p 5432 || echo "PostgreSQL service not ready"
          exit 1
        }
        
        # Run migrations
        echo "🔄 Running database migrations..."
        poetry run python -m lnbits --migrate
        
        # Test LNBits import
        echo "🐍 Testing LNBits import..."
        poetry run python -c "import lnbits; print('✅ LNBits import successful')" || {
          echo "❌ LNBits import failed"
          exit 1
        }
        
        # Start LNBits with logging
        echo "🚀 Starting LNBits with error capture..."
        poetry run python -m lnbits > ../lnbits.log 2>&1 &
        LNBITS_PID=$!
        echo $LNBITS_PID > ../lnbits.pid
        echo "LNBits started with PID: $LNBITS_PID"
        
        cd ..
        
        # Monitor startup with log output
        echo "⏳ Monitoring LNBits startup..."
        for i in {1..30}; do
          if ! ps -p $LNBITS_PID > /dev/null; then
            echo "❌ LNBits process died after $i seconds"
            echo "📋 Error log:"
            cat lnbits.log 2>/dev/null || echo "No log file found"
            exit 1
          fi
          
          if curl -f http://localhost:5001/ --max-time 3 2>/dev/null; then
            echo "✅ LNBits is ready!"
            break
          fi
          
          # Show recent log entries every 5 seconds
          if [ $((i % 5)) -eq 0 ]; then
            echo "⏳ Still waiting for LNBits... ($i/30)"
            echo "📋 Recent log entries:"
            tail -5 lnbits.log 2>/dev/null || echo "No log entries yet"
          fi
          
          sleep 1
        done
        
        # Final check with full error details
        if ! curl -f http://localhost:5001/ --max-time 5; then
          echo "❌ LNBits failed to start after 30 seconds"
          echo "📋 Process status:"
          ps -p $LNBITS_PID || echo "Process died"
          echo "📋 Full startup log:"
          cat lnbits.log 2>/dev/null || echo "No log file found"
          exit 1
        fi
        
    - name: Install Playwright
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium
        
    - name: Create admin account
      run: |
        cd tests
        node create-admin-account.js
        
    - name: Enable allowance extension
      run: |
        cd tests
        node enable-allowance.js
        
    - name: Test allowance creation (CRUD)
      run: |
        cd tests
        node create-allowance.js "Test Daily" 50 daily
        node create-allowance.js "Test Weekly" 100 weekly
        node create-allowance.js "Test Monthly" 200 monthly
        
    - name: Test allowance editing
      run: |
        cd tests
        node edit-allowance.js "Test Daily" "Updated Daily" 75 weekly
        
    - name: Test allowance deletion
      run: |
        cd tests
        node delete-allowance.js "Updated Daily"
        
    - name: Test API endpoints
      run: |
        cd tests
        echo "Testing API endpoints with curl..."
        
        # Test health check
        curl -f http://localhost:5001/api/v1/allowance || echo "Health check failed (expected - needs auth)"
        
        # Test API documentation endpoint
        curl -f http://localhost:5001/docs || echo "API docs endpoint check"
        
    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-screenshots
        path: tests/test-results/
        
    - name: Stop LNBits
      if: always()
      run: |
        echo "🛑 Stopping LNBits..."
        if [ -f lnbits.pid ]; then
          kill $(cat lnbits.pid) || true
        fi